<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="title desc">
  <title id="title">MyViewer logo concept with cursor</title>
  <desc id="desc">Barevná kontura monitoru MyViewer se šipkovým kurzorem přes displej.</desc>
  <g id="monitor-contour" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path id="red-segment" stroke="#E12B26" d="M20 55V28a18 18 0 0 1 18-18h42"/>
    <path id="blue-segment" stroke="#008BE2" d="M80 10h42a18 18 0 0 1 18 18v27"/>
    <path id="green-segment" stroke="#7CB342" d="M140 55v27a18 18 0 0 1-18 18H80"/>
    <path id="gold-segment" stroke="#F1A900" d="M80 100H38a18 18 0 0 1-18-18V55"/>
  </g>
  <style>
